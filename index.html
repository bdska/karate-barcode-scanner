<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Karate Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .barcode {
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }

  </style>

</head>

<body>

<h2>📷 Karate Barcode Scanner</h2>

<div id="reader"></div>

<div id="result">
  Starting scanner...
</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxMb_v8Vv_7BGQA204OjdLwmv13KtCog7R5iswsKeGSrIGa2ixb1mrjMSsa5H5UNaIVDg/exec";

let processing = false;


/* ==============================
   BARCODE FOUND
   ============================== */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  document.getElementById("result").innerHTML =
    "<b>🔎 Barcode detected</b><br><br>" +
    "<span class='barcode'>" +
    decodedText +
    "</span><br><br>" +
    "Looking up athlete...";


  /*
     Create a hidden iframe.

     The browser is allowed to load another
     website inside an iframe even though it
     cannot use fetch() across domains.
  */

  const iframe = document.createElement("iframe");

  iframe.style.display = "none";

  iframe.src =
    APPS_SCRIPT_URL +
    "?action=findAthlete" +
    "&barcode=" +
    encodeURIComponent(decodedText);

  document.body.appendChild(iframe);


  /*
     Keep scanner from repeatedly processing
     the same barcode.
  */

  setTimeout(function() {

    processing = false;

  }, 5000);

}


/* ==============================
   SCANNER ERROR
   ============================== */

function onScanFailure(error) {

  // Continuous scan errors are ignored.

}


/* ==============================
   START CAMERA
   ============================== */

function startScanner() {

  const config = {

    fps: 10,

    qrbox: {
      width: 300,
      height: 120
    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128
    ]

  };


  const scanner =
    new Html5QrcodeScanner(
      "reader",
      config,
      false
    );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );

}


window.addEventListener(
  "load",
  startScanner
);

</script>

</body>
</html>
