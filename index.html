<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Karate Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 8px;
      text-align: center;
      background: #f5f5f5;
      overflow-x: hidden;
    }

    h2 {
      margin: 4px 0 8px 0;
      font-size: 22px;
    }

    /* ==========================================
       SCANNER OUTER WINDOW
       ========================================== */

    #reader {
      width: 100%;
      max-width: 500px;
      height: 50vh;
      max-height: 300px;
      min-height: 180px;

      margin: 0 auto;

      background: white;
      border-radius: 10px;
      overflow: hidden;

      position: relative;
    }


    /* ==========================================
       CONTROL CAMERA AREA CREATED BY
       HTML5-QRCODE
       ========================================== */

    #reader__scan_region {
      width: 100% !important;
      max-height: 50vh !important;
      overflow: hidden !important;
    }

    #reader video {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      max-height: 50vh !important;
      object-fit: cover !important;
    }


    /* ==========================================
       RESULT / ATHLETE DETAILS
       ========================================== */

    #result {
      width: 100%;
      max-width: 500px;

      margin: 8px auto 0 auto;

      padding: 10px;

      background: white;
      border-radius: 10px;

      font-size: 17px;
      line-height: 1.3;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.1);
    }

    .barcode {
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }


    /* ==========================================
       MOBILE PHONE
       ========================================== */

    @media (max-width: 600px) {

      body {
        padding: 5px;
      }

      h2 {
        font-size: 20px;
        margin: 3px 0 6px 0;
      }

      #reader {
        height: 48vh;
        max-height: 280px;
        min-height: 170px;
      }

      #reader__scan_region {
        max-height: 48vh !important;
      }

      #reader video {
        max-height: 48vh !important;
      }

      #result {
        margin-top: 6px;
        padding: 9px;
        font-size: 16px;
        line-height: 1.25;
      }

      .barcode {
        font-size: 17px;
      }

    }

  </style>

</head>


<body>

  <h2>📷 BDSKA SCANNER </h2>

  <div id="reader"></div>

  <div id="result">
    Starting scanner...
  </div>


<script>

  // ==========================================
  // APPS SCRIPT WEB APP
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzHdzmYcTAW91JPp67lArf0VoOmXv8yWBs4daH3dpYEEYTusqjJJ6VEqx8QEKYBKcIEkQ/exec";


  let processing = false;


  // ==========================================
  // BARCODE FOUND
  // ==========================================

  function onScanSuccess(decodedText) {

    if (processing) {
      return;
    }

    processing = true;


    document.getElementById("result").innerHTML =
      "<b>🔎 Barcode detected</b><br>" +
      "<span class='barcode'>" +
      decodedText +
      "</span><br>" +
      "Looking up athlete...";


    lookupAthlete(decodedText);

  }


  // ==========================================
  // LOOK UP ATHLETE
  // ==========================================

  function lookupAthlete(barcode) {

    const callbackName =
      "barcodeLookup_" + Date.now();


    window[callbackName] =
      function(result) {

        try {
          delete window[callbackName];
        } catch (e) {}


        if (!result || !result.success) {

          document.getElementById("result").innerHTML =
            "<div class='error'>" +
            "❌ " +
            (result
              ? result.message
              : "Athlete not found.") +
            "</div>";

          processing = false;

          return;
        }


        // ======================================
        // ATHLETE FOUND
        // ======================================

        document.getElementById("result").innerHTML =

          "<div class='success'>" +
          "✅ Athlete Found" +
          "</div>" +

          "<b>Athlete ID:</b> " +
          result.athleteId +

          "<br>" +

          "<b>Athlete Name:</b> " +
          result.athleteName +

          "<br>" +

          "<b>Barcode:</b> " +
          result.barcode;


        processing = false;

      };


    const url =
      APPS_SCRIPT_URL +
      "?action=findAthlete" +
      "&barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callbackName;


    const script =
      document.createElement("script");


    script.src = url;


    script.onerror =
      function() {

        document.getElementById("result").innerHTML =
          "<div class='error'>" +
          "❌ Connection error." +
          "</div>";

        processing = false;

      };


    document.body.appendChild(script);


    // ==========================================
    // TIMEOUT PROTECTION
    // ==========================================

    setTimeout(function() {

      if (window[callbackName]) {

        document.getElementById("result").innerHTML =
          "<div class='error'>" +
          "❌ Google Sheet response timed out." +
          "</div>";

        processing = false;

        try {
          delete window[callbackName];
        } catch (e) {}

      }

    }, 10000);

  }


  // ==========================================
  // SCANNER FAILURE
  // ==========================================

  function onScanFailure(error) {

    // Ignore continuous scanning errors.

  }


  // ==========================================
  // START CAMERA
  // ==========================================

  function startScanner() {

    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 100
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ]

    };


    const scanner =
      new Html5QrcodeScanner(
        "reader",
        config,
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  }


  // ==========================================
  // START WHEN PAGE LOADS
  // ==========================================

  window.addEventListener(
    "load",
    startScanner
  );

</script>

</body>
</html>
