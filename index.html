<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Food Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 8px;
      text-align: center;
      background: #f5f5f5;
      overflow-x: hidden;
    }

    h2 {
      margin: 4px 0 8px 0;
      font-size: 22px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      height: 45vh;
      max-height: 280px;
      min-height: 170px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    #reader__scan_region {
      width: 100% !important;
      max-height: 45vh !important;
      overflow: hidden !important;
    }

    #reader video {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      max-height: 45vh !important;
      object-fit: cover !important;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 8px auto 0 auto;
      padding: 12px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.4;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.1);
    }

    .name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .role {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .meal-button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    .meal-button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <h2>🍱 Food Scanner</h2>

  <div id="reader"></div>

  <div id="result">
    Starting scanner...
  </div>


<script>

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwSaEXhqfUAcLUcngYCFdHobH2qArR5vxmAnmZX5eZmab08fxM--DTCt5GyzAiax1slmg/exec";

  let processing = false;

  let currentFoodPerson = null;


  function onScanSuccess(decodedText) {

    if (processing) {
      return;
    }

    processing = true;

    document.getElementById("result").innerHTML =
      "<b>🔎 Barcode detected</b><br>" +
      "<b>" + decodedText + "</b><br>" +
      "Looking up person...";

    lookupFoodPerson(decodedText);
  }


  function lookupFoodPerson(barcode) {

    const callbackName =
      "foodLookup_" + Date.now();

    window[callbackName] =
      function(result) {

        try {
          delete window[callbackName];
        } catch (e) {}

        if (!result || !result.success) {

          document.getElementById("result").innerHTML =
            "<div class='error'>" +
            "❌ " +
            (result
              ? result.message
              : "Person not found.") +
            "</div>";

          processing = false;
          return;
        }

        showFoodOptions(result);

        processing = false;
      };


    const url =
      APPS_SCRIPT_URL +
      "?action=foodLookup" +
      "&barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callbackName;


    const script =
      document.createElement("script");

    script.src = url;

    script.onerror =
      function() {

        document.getElementById("result").innerHTML =
          "<div class='error'>" +
          "❌ Connection error." +
          "</div>";

        processing = false;
      };

    document.body.appendChild(script);


    setTimeout(function() {

      if (window[callbackName]) {

        document.getElementById("result").innerHTML =
          "<div class='error'>" +
          "❌ Google Sheet response timed out." +
          "</div>";

        processing = false;

        try {
          delete window[callbackName];
        } catch (e) {}

      }

    }, 10000);

  }


  function showFoodOptions(person) {

    currentFoodPerson = person;

    let html =

      "<div class='name'>" +
      person.name +
      "</div>" +

      "<div class='role'>" +
      person.role +
      "</div>";


    const role =
      String(person.role || "")
        .trim()
        .toUpperCase();


    if (
      role === "ATHLETE" ||
      role === "VENDORS"
    ) {

      html +=
        createMealButton(
          "🍱 LUNCH 1",
          "Lunch 1",
          person
        ) +

        createMealButton(
          "🍱 LUNCH 2",
          "Lunch 2",
          person
        );

    }


    else if (
      role === "OFFICIALS" ||
      role === "GUEST"
    ) {

      html +=
        createMealButton(
          "☕ BREAKFAST 1",
          "Breakfast 1",
          person
        ) +

        createMealButton(
          "🍱 LUNCH 1",
          "Lunch 1",
          person
        ) +

        createMealButton(
          "☕ BREAKFAST 2",
          "Breakfast 2",
          person
        ) +

        createMealButton(
          "🍱 LUNCH 2",
          "Lunch 2",
          person
        );

    }


    else if (
      role === "REFEREES"
    ) {

      html +=
        createMealButton(
          "☕ BREAKFAST 1",
          "Breakfast 1",
          person
        ) +

        createMealButton(
          "🍱 LUNCH 1",
          "Lunch 1",
          person
        ) +

        createMealButton(
          "☕ BREAKFAST 2",
          "Breakfast 2",
          person
        ) +

        createMealButton(
          "🍱 LUNCH 2",
          "Lunch 2",
          person
        );

    }


    else {

      html +=
        "<div class='error'>" +
        "❌ Unknown person type" +
        "</div>";

    }


    document.getElementById("result").innerHTML =
      html;

  }


  function createMealButton(
    label,
    meal,
    person
  ) {

    return (
      "<button " +
      "class='meal-button' " +
      "onclick='issueMeal(" +
      JSON.stringify(meal) +
      ")'>" +
      label +
      "</button>"
    );

  }


  function issueMeal(meal) {

    const buttons =
      document.querySelectorAll(
        ".meal-button"
      );

    buttons.forEach(function(button) {
      button.disabled = true;
    });


    const currentPerson =
  currentFoodPerson;


    if (!currentPerson) {

      showError(
        "Person information is missing."
      );

      return;
    }


    const callbackName =
      "foodIssue_" + Date.now();


    window[callbackName] =
      function(result) {

        try {
          delete window[callbackName];
        } catch (e) {}


        if (!result || !result.success) {

          showError(
            result
              ? result.message
              : "Meal could not be issued."
          );

          buttons.forEach(function(button) {
            button.disabled = false;
          });

          return;
        }


        document.getElementById("result").innerHTML =
          "<div class='success'>" +
          "✅ " +
          result.message +
          "</div><br>" +

          "<div class='name'>" +
          currentPerson.name +
          "</div>" +

          "<div class='role'>" +
          currentPerson.role +
          "</div><br>" +

          "<button " +
          "class='meal-button' " +
          "onclick='scanNext()'>" +
          "📷 SCAN NEXT" +
          "</button>";

      };


    const url =
      APPS_SCRIPT_URL +
      "?action=issueFood" +
      "&personId=" +
      encodeURIComponent(
        currentPerson.personId || ""
      ) +
      "&name=" +
      encodeURIComponent(
        currentPerson.name || ""
      ) +
      "&role=" +
      encodeURIComponent(
        currentPerson.role || ""
      ) +
      "&meal=" +
      encodeURIComponent(meal) +
      "&callback=" +
      callbackName;


    const script =
      document.createElement("script");

    script.src = url;


    script.onerror =
      function() {

        showError(
          "Connection error while issuing meal."
        );

        buttons.forEach(function(button) {
          button.disabled = false;
        });

      };


    document.body.appendChild(script);


    setTimeout(function() {

      if (window[callbackName]) {

        showError(
          "Google Sheet response timed out."
        );

        buttons.forEach(function(button) {
          button.disabled = false;
        });

        try {
          delete window[callbackName];
        } catch (e) {}

      }

    }, 10000);

  }


  function showError(message) {

    document.getElementById("result").innerHTML =
      "<div class='error'>" +
      "❌ " +
      message +
      "</div>";

  }


  function scanNext() {

    window.currentFoodPerson = null;

    document.getElementById("result").innerHTML =
      "Ready to scan next person...";

  }


  function onScanFailure(error) {
    // Ignore continuous scanning errors.
  }


  function startScanner() {

    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 100
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ]

    };


    const scanner =
      new Html5QrcodeScanner(
        "reader",
        config,
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  }


  window.addEventListener(
    "load",
    startScanner
  );


</script>

</body>
</html>
```
