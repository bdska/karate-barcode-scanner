<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karate Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .barcode-value {
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }

    .error {
      color: #b00020;
    }
  </style>

</head>

<body>

<h2>📷 Karate Barcode Scanner</h2>

<div id="reader"></div>

<div id="result">
  Starting scanner...
</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxMb_v8Vv_7BGQA204OjdLwmv13KtCog7R5iswsKeGSrIGa2ixb1mrjMSsa5H5UNaIVDg/exec";

let lastScanned = "";
let lastScanTime = 0;
let lookupInProgress = false;


/* =========================
   BARCODE SCANNED
   ========================= */

function onScanSuccess(decodedText) {

  const now = Date.now();

  if (lookupInProgress) {
    return;
  }

  if (
    decodedText === lastScanned &&
    now - lastScanTime < 3000
  ) {
    return;
  }

  lastScanned = decodedText;
  lastScanTime = now;
  lookupInProgress = true;

  document.getElementById("result").innerHTML =
    "<b>🔎 Looking up athlete...</b><br><br>" +
    "<span class='barcode-value'>" +
    decodedText +
    "</span>";

  lookupAthlete(decodedText);
}


/* =========================
   GOOGLE SHEET LOOKUP
   ========================= */

function lookupAthlete(barcode) {

  const callbackName =
    "barcodeCallback_" + Date.now();

  const script =
    document.createElement("script");

  let finished = false;

  window[callbackName] = function(result) {

    if (finished) return;

    finished = true;

    if (result && result.success) {

      document.getElementById("result").innerHTML =

        "<h3>✅ Athlete Found</h3>" +

        "<b>Athlete ID:</b><br>" +
        result.athleteId +

        "<br><br>" +

        "<b>Athlete Name:</b><br>" +
        result.athleteName +

        "<br><br>" +

        "<b>Barcode:</b><br>" +
        result.barcode;

    } else {

      document.getElementById("result").innerHTML =

        "<h3>❌ Athlete Not Found</h3>" +

        "<div>" +
        (result && result.message
          ? result.message
          : "Barcode was not found.") +
        "</div>";
    }

    cleanup();
  };


  function cleanup() {

    lookupInProgress = false;

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    delete window[callbackName];
  }


  script.onerror = function() {

    if (finished) return;

    finished = true;

    document.getElementById("result").innerHTML =

      "<h3 class='error'>❌ Connection Error</h3>" +
      "<div>Unable to contact Google Sheet.</div>";

    cleanup();
  };


  const requestUrl =
    APPS_SCRIPT_URL +
    "?action=findAthlete" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  script.src = requestUrl;

  document.body.appendChild(script);


  // Safety timeout
  setTimeout(function() {

    if (!finished) {

      finished = true;

      document.getElementById("result").innerHTML =

        "<h3 class='error'>❌ Connection Timeout</h3>" +
        "<div>Google Sheet did not respond.</div>";

      cleanup();
    }

  }, 10000);
}


/* =========================
   SCANNER
   ========================= */

function onScanFailure(error) {
  // Ignore continuous scanning failures
}


function startScanner() {

  if (
    typeof Html5QrcodeScanner ===
    "undefined"
  ) {

    document.getElementById("result").innerHTML =
      "<h3 class='error'>❌ Scanner library did not load.</h3>";

    return;
  }


  const scannerConfig = {

    fps: 10,

    qrbox: {
      width: 300,
      height: 120
    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128
    ]
  };


  const scanner =
    new Html5QrcodeScanner(
      "reader",
      scannerConfig,
      false
    );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );
}


window.addEventListener(
  "load",
  startScanner
);

</script>

</body>
</html>
