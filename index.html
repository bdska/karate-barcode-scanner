<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Karate Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .barcode {
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <h2>📷 Karate Barcode Scanner</h2>

  <div id="reader"></div>

  <div id="result">
    Starting scanner...
  </div>


<script>

  // ==========================================
  // LATEST APPS SCRIPT WEB APP
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzmUCBe0R4JnjM7CLt2Ksav5G_p99_xdPNMcvXtpDVytDEfMlCOrgSu66uyqfxEzYfX7Q/exec";


  let processing = false;


  // ==========================================
  // BARCODE FOUND
  // ==========================================

  function onScanSuccess(decodedText) {

    if (processing) {
      return;
    }

    processing = true;


    document.getElementById("result").innerHTML =
      "<b>🔎 Barcode detected</b><br><br>" +
      "<span class='barcode'>" +
      decodedText +
      "</span><br><br>" +
      "Looking up athlete...";


    lookupAthlete(decodedText);

  }


  // ==========================================
  // LOOK UP ATHLETE
  // ==========================================

  function lookupAthlete(barcode) {

    const callbackName =
      "barcodeLookup_" + Date.now();


    window[callbackName] =
      function(result) {

        // Remove callback
        try {
          delete window[callbackName];
        } catch (e) {}


        if (!result || !result.success) {

          document.getElementById("result").innerHTML =
            "<div class='error'>" +
            "❌ " +
            (result
              ? result.message
              : "Athlete not found.") +
            "</div>";

          processing = false;

          return;
        }


        // ======================================
        // ATHLETE FOUND
        // ======================================

        document.getElementById("result").innerHTML =

          "<div class='success'>" +
          "✅ Athlete Found" +
          "</div>" +

          "<br>" +

          "<b>Athlete ID:</b><br>" +
          result.athleteId +

          "<br><br>" +

          "<b>Athlete Name:</b><br>" +
          result.athleteName +

          "<br><br>" +

          "<b>Barcode:</b><br>" +
          result.barcode;


        processing = false;

      };


    const url =
      APPS_SCRIPT_URL +
      "?action=findAthlete" +
      "&barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callbackName;


    const script =
      document.createElement("script");


    script.src = url;


    script.onerror =
      function() {

        document.getElementById("result").innerHTML =
          "<div class='error'>" +
          "❌ Connection error." +
          "</div>";

        processing = false;

      };


    document.body.appendChild(script);


    // Timeout protection

    setTimeout(function() {

      if (window[callbackName]) {

        document.getElementById("result").innerHTML =
          "<div class='error'>" +
          "❌ Google Sheet response timed out." +
          "</div>";

        processing = false;

        try {
          delete window[callbackName];
        } catch (e) {}

      }

    }, 10000);

  }


  // ==========================================
  // SCANNER FAILURE
  // ==========================================

  function onScanFailure(error) {

    // Ignore continuous scanning errors.

  }


  // ==========================================
  // START CAMERA
  // ==========================================

  function startScanner() {

    const config = {

      fps: 10,

      qrbox: {
        width: 300,
        height: 120
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ]

    };


    const scanner =
      new Html5QrcodeScanner(
        "reader",
        config,
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  }


  // ==========================================
  // START WHEN PAGE LOADS
  // ==========================================

  window.addEventListener(
    "load",
    startScanner
  );

</script>

</body>
</html>
