<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karate Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .barcode-value {
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }

    .loading {
      font-size: 18px;
    }
  </style>

</head>

<body>

<h2>📷 Karate Barcode Scanner</h2>

<div id="reader"></div>

<div id="result">
  Starting scanner...
</div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxMb_v8Vv_7BGQA204OjdLwmv13KtCog7R5iswsKeGSrIGa2ixb1mrjMSsa5H5UNaIVDg/exec";

let lastScanned = "";
let lastScanTime = 0;

function onScanSuccess(decodedText, decodedResult) {

  const now = Date.now();

  // Prevent the same barcode from being processed repeatedly
  if (
    decodedText === lastScanned &&
    now - lastScanTime < 3000
  ) {
    return;
  }

  lastScanned = decodedText;
  lastScanTime = now;

  document.getElementById("result").innerHTML =
    "<div class='loading'>🔎 Looking up athlete...</div>" +
    "<br>" +
    "<span class='barcode-value'>" +
    decodedText +
    "</span>";

  lookupAthlete(decodedText);
}

function onScanFailure(error) {
  // Ignore continuous scanning errors
}

function lookupAthlete(barcode) {

  const url =
    APPS_SCRIPT_URL +
    "?action=findAthlete&barcode=" +
    encodeURIComponent(barcode);

  fetch(url)
    .then(response => response.json())
    .then(result => {

      if (!result.success) {

        document.getElementById("result").innerHTML =
          "<h3>❌ Athlete Not Found</h3>" +
          "<div>" +
          result.message +
          "</div>";

        return;
      }

      document.getElementById("result").innerHTML =
        "<h3>✅ Athlete Found</h3>" +

        "<b>Athlete ID:</b><br>" +
        result.athleteId +

        "<br><br>" +

        "<b>Athlete Name:</b><br>" +
        result.athleteName +

        "<br><br>" +

        "<b>Barcode:</b><br>" +
        result.barcode;
    })
    .catch(error => {

      document.getElementById("result").innerHTML =
        "<h3>❌ Connection Error</h3>" +
        "<div>" +
        error.message +
        "</div>";
    });
}

const scannerConfig = {

  fps: 10,

  qrbox: {
    width: 300,
    height: 120
  },

  formatsToSupport: [
    Html5QrcodeSupportedFormats.CODE_128
  ]
};

const scanner = new Html5QrcodeScanner(
  "reader",
  scannerConfig,
  false
);

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
