<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karate Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .barcode-value {
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>

</head>

<body>

<h2>📷 Karate Barcode Scanner</h2>

<div id="reader"></div>

<div id="result">
  Starting scanner...
</div>

<script>

let lastScanned = "";
let lastScanTime = 0;

function onScanSuccess(decodedText, decodedResult) {

  const now = Date.now();

  // Prevent the same barcode being processed repeatedly
  if (
    decodedText === lastScanned &&
    now - lastScanTime < 2000
  ) {
    return;
  }

  lastScanned = decodedText;
  lastScanTime = now;

  document.getElementById("result").innerHTML =
    "<b>✅ Barcode detected</b><br><br>" +
    "<span class='barcode-value'>" +
    decodedText +
    "</span>";

  console.log("Barcode:", decodedText);
}

function onScanFailure(error) {
  // Ignore continuous scan failures
}

const scannerConfig = {
  fps: 10,

  qrbox: {
    width: 300,
    height: 120
  },

  formatsToSupport: [
    Html5QrcodeSupportedFormats.CODE_128
  ]
};

const scanner = new Html5QrcodeScanner(
  "reader",
  scannerConfig,
  false
);

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
